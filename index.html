<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outline</title>
<style>
:root{--bg:#fbfaf8;--fg:#24231f;--mute:#a19e95;--line:#ebe8e1;--bul:#b9b5aa;--ring:#e6e3da;--accent:#5b6cff;--hover:#f1efe9;color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--fg:#e9e7e1;--mute:#76736b;--line:#262522;--bul:#5d5a53;--ring:#2c2b27;--accent:#8e9aff;--hover:#222120;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--fg:#e9e7e1;--mute:#76736b;--line:#262522;--bul:#5d5a53;--ring:#2c2b27;--accent:#8e9aff;--hover:#222120;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 ui-sans-serif,-apple-system,"Inter","Segoe UI",Roboto,sans-serif;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar{max-width:760px;margin:auto;padding:12px 28px;display:flex;align-items:center;gap:12px}
#crumbs{flex:1;display:flex;align-items:center;gap:6px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;font-size:14px;color:var(--mute)}
#crumbs::-webkit-scrollbar{display:none}
.crumb{padding:2px 6px;border-radius:6px;max-width:200px;overflow:hidden;text-overflow:ellipsis}
button.crumb:hover{background:var(--hover);color:var(--fg)}
.crumb.cur{color:var(--fg)}
.sep{opacity:.5}
.tools{display:flex;gap:2px}
.tools button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--mute);transition:background .15s,color .15s}
.tools button:hover{background:var(--hover);color:var(--fg)}
.tools svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
main{max-width:760px;margin:auto;padding:18px 28px 0}
#title{font-size:30px;line-height:1.25;font-weight:650;letter-spacing:-.02em;margin:6px 0 18px;outline:none;caret-color:var(--accent);word-break:break-word}
#title:empty::before{content:"Untitled";color:var(--mute)}
ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:flex-start;margin-left:-22px}
.tog{width:22px;height:27px;display:grid;place-items:center;opacity:0;color:var(--mute);flex:none;transition:opacity .15s}
.tog svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transform:rotate(90deg);transition:transform .2s}
.has-kids>.row:hover .tog,.has-kids.collapsed>.row .tog{opacity:1}
@media (hover:none){.has-kids>.row .tog{opacity:.6}}
.collapsed>.row .tog svg{transform:rotate(0)}
.bul{width:22px;height:27px;display:grid;place-items:center;flex:none}
.bul i{width:6px;height:6px;border-radius:50%;background:var(--bul);transition:transform .15s,background .15s,box-shadow .2s}
.bul:hover i{background:var(--accent);transform:scale(1.5)}
.collapsed>.row .bul i{box-shadow:0 0 0 4px var(--ring)}
.txt{flex:1;min-width:0;min-height:27px;padding:0 0 0 4px;outline:none;white-space:pre-wrap;word-break:break-word;caret-color:var(--accent)}
.txt:empty:focus::before{content:"Type something\2026";color:var(--mute);opacity:.6}
.kw{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease}
.kids{min-height:0;overflow:hidden;margin-left:10px;padding-left:12px;border-left:1px solid var(--line)}
.collapsed>.kw{grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .22s ease,visibility 0s .22s}
.ab{width:26px;height:27px;display:grid;place-items:center;color:var(--mute);opacity:0;flex:none;border-radius:6px;transition:opacity .15s,color .15s}
.ab svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row:hover>.ab,.row:focus-within>.ab{opacity:.65}
.row>.ab:hover{opacity:1;background:var(--hover);color:var(--fg)}
.row>.del:hover{color:#d4543f}
.row{position:relative}
.ck{display:none;width:22px;height:27px;place-items:center;flex:none}
.ck::before{content:"";width:16px;height:16px;border:1.6px solid var(--bul);border-radius:5px;background:var(--bg);transition:background .15s,border-color .15s}
.ck:hover::before{border-color:var(--accent)}
.chk>.row>.ck{display:grid}
.done>.row>.ck::before{background:var(--accent) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2.5 6.2l2.4 2.4 4.6-5' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/12px no-repeat;border-color:var(--accent)}
.done>.row .txt{text-decoration:line-through;color:var(--mute)}
.due{display:none;margin:3px 0 0 6px;padding:0 8px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;line-height:21px;color:var(--mute);white-space:nowrap;flex:none}
.has-due>.row>.due{display:block}
.due.od{color:#d4543f;border-color:currentColor}
.done>.row>.due{opacity:.5}
.due span{margin-left:3px;opacity:.6}
.dp{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer;font-size:16px}
.dp::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.ab{position:relative;pointer-events:none}
.row:hover>.ab,.row:focus-within>.ab{pointer-events:auto}
.due{position:relative;cursor:pointer}
.due span{position:relative;z-index:2}
#pad{min-height:40vh;cursor:text}
.hint{max-width:760px;margin:auto;padding:0 28px 28px;font-size:12.5px;color:var(--mute);opacity:.8}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;display:flex;gap:12px}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{text-decoration:underline;font-weight:600}
.tabs{max-width:760px;margin:auto;padding:0 28px 8px;display:flex;gap:4px}
.tabs button{padding:3px 12px;border-radius:999px;font-size:13.5px;color:var(--mute);transition:background .15s,color .15s}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--hover);color:var(--fg)}
.tools button:disabled{opacity:.35;cursor:default}
.tools button:disabled:hover{background:none;color:var(--mute)}
#map{overflow:auto;margin:0 -28px;padding:0 28px 40px;height:calc(100dvh - 140px);min-height:320px;touch-action:pan-x pan-y;overscroll-behavior:contain}
#map svg{display:block;max-width:none}
.cap{position:sticky;top:0;left:28px;z-index:2;display:flex;align-items:center;gap:6px;padding:8px 0;background:var(--bg);font-size:12.5px;color:var(--mute)}
.cap span{flex:1}
.tools button[hidden],#ai[hidden]{display:none}
#ai{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 24px));max-height:62vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.18);padding:14px 16px;z-index:8}
.ah{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.ah b{flex:1;color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;margin:10px 0}
.chips button,.cap button,.ah button{padding:3px 11px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;color:var(--mute)}
.chips button.on{background:var(--hover);color:var(--fg);border-color:var(--bul)}
.chips button:hover,.cap button:hover,.ah button:hover,.sg button:hover{color:var(--fg);background:var(--hover)}
.sg{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:15.5px;line-height:1.45}
.sg span{flex:1}
.sg button{width:28px;height:28px;border-radius:8px;color:var(--accent);font-size:18px;line-height:1}
.am{font-size:14px;color:var(--mute);padding:6px 0}
.ask{display:flex;gap:8px;margin:2px 0 8px}
.ask input{flex:1;min-width:0;font:inherit;font-size:15px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);outline:none}
.ask input:focus{border-color:var(--accent)}
.ask button{padding:0 14px;border-radius:10px;background:var(--accent);color:var(--bg);font-size:14px;font-weight:600}
.ans{white-space:pre-wrap;font-size:15.5px;line-height:1.5;padding:8px 0;border-top:1px solid var(--line)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.acts button{padding:3px 11px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;color:var(--mute)}
.acts button:hover{color:var(--fg);background:var(--hover)}
.cp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px;font-size:13px;color:var(--mute)}
.cp button{padding:3px 11px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;color:var(--mute)}
.cp button:hover{color:var(--fg);background:var(--hover)}
#aiTx{width:100%;height:110px;margin:0 0 8px;font:inherit;font-size:13px;line-height:1.4;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);resize:vertical}
#sync{margin-left:10px;align-self:center;font-size:12px;color:var(--mute)}
#note{margin:-8px 0 20px;color:var(--mute);font-size:15.5px;line-height:1.55;outline:none;white-space:pre-wrap;word-break:break-word;caret-color:var(--accent)}
#note:empty::before{content:attr(data-ph);opacity:.65}
.tabs #bSearch{margin-left:auto;padding:3px 8px;display:grid;place-items:center}
.tabs #bSearch svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
#sr{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 14px 30px rgba(0,0,0,.12)}
.srb{max-width:760px;margin:auto;padding:10px 28px 14px}
#sq{width:100%;font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);outline:none}
#sq:focus{border-color:var(--accent)}
#sl{max-height:55vh;overflow:auto;margin-top:6px}
.sri{display:block;width:100%;text-align:left;padding:8px 6px;border-top:1px solid var(--line)}
.sri:hover{background:var(--hover)}
.srt{display:block;font-size:16px;line-height:1.4}
.srt i{color:var(--mute);font-style:normal;font-size:13px}
.srp{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.hit{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:6px}
.pg{display:none;margin:3px 0 0 6px;font-size:12.5px;line-height:21px;color:var(--mute);flex:none}
.pg.on{display:block}
#tb{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tb[hidden]{display:none}
#tb button{flex:1;min-width:0;height:44px;font-size:19px;color:var(--mute);display:grid;place-items:center}
#tb button:active{background:var(--hover);color:var(--fg)}
#tb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media (pointer:fine){#tb{display:none!important}}
@media (pointer:coarse){body.tbon{padding-bottom:56px}}
.ml{fill:none;stroke:var(--bul);stroke-width:1.5;opacity:.55}
.mn{cursor:pointer}
.mn rect{fill:var(--hover);stroke:var(--line);transition:stroke .15s}
.mn:hover rect{stroke:var(--accent)}
.mn text{fill:var(--fg);font:14px ui-sans-serif,-apple-system,"Inter","Segoe UI",sans-serif}
.mn.r rect{fill:var(--accent);stroke:none}
.mn.r text{fill:var(--bg);font-weight:600}
</style>
</head>
<body>
<header><div class="bar">
  <nav id="crumbs" aria-label="Breadcrumb"></nav>
  <div class="tools">
    <button id="bAI" title="Suggest for this item" aria-label="Suggest"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg></button><button id="bUndo" title="Undo (Ctrl/⌘+Z)" aria-label="Undo" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button><button id="bRedo" title="Redo (Ctrl/⌘+Shift+Z)" aria-label="Redo" disabled><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button><button id="bTheme" title="Toggle light/dark" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    <button id="bExp" title="Export JSON backup" aria-label="Export"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></button>
    <button id="bImp" title="Import JSON backup" aria-label="Import"><svg viewBox="0 0 24 24"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></svg></button>
  </div>
</div><div class="tabs"><button id="tOut" class="on">Outline</button><button id="tMap">Map</button><button id="bSearch" title="Search (Ctrl/⌘+K)" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button><span id="sync"></span></div><div id="sr" hidden><div class="srb"><input id="sq" type="text" placeholder="Search items and descriptions…" autocomplete="off"><div id="sl"></div></div></div></header>
<main>
  <h1 id="title" contenteditable="plaintext-only" spellcheck="false" hidden></h1>
  <div id="note" contenteditable="plaintext-only" spellcheck="false" data-ph="What is this, and what do you want to accomplish? (optional)" hidden></div>
  <ul id="list"></ul>
  <div id="pad"></div>
  <div id="map" hidden></div>
</main>
<div class="hint">Enter new line · Tab / Shift+Tab nest · Alt+↑↓ move · ⌘/Ctrl+↑↓ fold · ⌘/Ctrl+Z undo · ⌘/Ctrl+Shift+⌫ delete · Alt+L checklist · ⌘/Ctrl+Enter done · click a bullet to zoom</div>
<input type="file" id="file" accept=".json,application/json" hidden>
<div id="toast"></div>
<div id="ai" hidden></div>
<div id="tb" hidden><button data-k="out" aria-label="Outdent">⇤</button><button data-k="in" aria-label="Indent">⇥</button><button data-k="up" aria-label="Move up">↑</button><button data-k="dn" aria-label="Move down">↓</button><button data-k="ck" aria-label="Checklist">☑</button><button data-k="undo" aria-label="Undo">↶</button><button data-k="redo" aria-label="Redo">↷</button><button data-k="del" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button></div>
<script>
(()=>{
const KEY='outliner.v1',TK='outliner.theme';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const mk=(t='')=>({id:uid(),text:t,children:[],collapsed:false,note:'',chk:null,due:''});
const cl=n=>({id:String(n.id||uid()),text:String(n.text||''),note:String(n.note||''),chk:n.chk===true||n.chk===false?n.chk:null,due:/^\d{4}-\d{2}-\d{2}$/.test(n.due||'')?n.due:'',collapsed:!!n.collapsed,children:Array.isArray(n.children)?n.children.map(cl):[]});
const norm=d=>{const r=cl(d.root);r.id='root';return{root:r,zoom:'root'}};
const seed=()=>{const r=mk();r.id='root';const a=mk('Welcome to your outline');a.children=[mk('Press Enter for a new line, Tab to tuck it under the line above'),mk('Shift+Tab brings it back out'),(()=>{const x=mk('Click the chevron to fold this, or click my bullet to zoom in');x.children=[mk('Use the breadcrumb at the top to zoom back out')];return x})(),mk('Everything saves automatically in this browser. Use the arrow icons up top to back up as JSON')];r.children=[a,mk()];return{root:r,zoom:'root'}};

let S;
try{const d=JSON.parse(localStorage.getItem(KEY));S=d&&d.root&&Array.isArray(d.root.children)?norm(d):seed()}catch(e){S=seed()}
S.zoom=(JSON.parse((()=>{try{return localStorage.getItem(KEY+'.zoom')||'null'}catch(e){return'null'}})())||'root');
let focusReq=null,st,U=[],Rd=[],cur=JSON.stringify(S.root),tTyp=0,view='outline',ms=1,fitNext=true,mW=1,mH=1,lastFocus=null,SM=null,aiKind='ideas',aiT=null,aiItems=[],aiBusy=false,aiErr='',aiRun=0,aiQ='',aiAns='',aiTx='';
const hadData=(()=>{try{return!!localStorage.getItem(KEY)}catch(e){return false}})();
const ls=k=>{try{return+localStorage.getItem(KEY+k)||0}catch(e){return 0}};
let rev=ls('.rev'),synced=ls('.syn'),DEV=uid(),dref=null,pt=null,pushing=false,lastStr='',col=null,sent=new Map();

function save(t){hist(t);queuePush();clearTimeout(st);st=setTimeout(flush,250)}
function hist(t){const s=JSON.stringify(S.root);if(s===cur)return;const n=Date.now();if(!(t&&n-tTyp<1000)){U.push(cur);if(U.length>200)U.shift()}tTyp=t?n:0;cur=s;Rd=[];stamp();ub()}
function ub(){$('#bUndo').disabled=!U.length;$('#bRedo').disabled=!Rd.length}
function step(a,b){if(!a.length)return;const el=document.activeElement,id=el&&el.dataset&&el.dataset.id,o=el&&el.classList&&el.classList.contains('txt')?caret(el):0;b.push(cur);cur=a.pop();S.root=JSON.parse(cur);tTyp=0;stamp();focusReq=id?{id,pos:o}:null;render();flush();ub();queuePush()}
const undo=()=>step(U,Rd),redo=()=>step(Rd,U);
function flush(){if(!hadData&&!rev)return;try{localStorage.setItem(KEY,JSON.stringify({root:S.root}));localStorage.setItem(KEY+'.zoom',JSON.stringify(S.zoom))}catch(e){}}
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

function path(id,n=S.root,p=[]){p=[...p,n];if(n.id===id)return p;for(const c of n.children){const r=path(id,c,p);if(r)return r}return null}
function ctx(id){const p=path(id),n=p[p.length-1],par=p[p.length-2];return{n,par,i:par.children.indexOf(n)}}
const zoomNode=()=>{const p=path(S.zoom)||[S.root];return p[p.length-1]};

function caret(el){const s=getSelection();if(!s.rangeCount||!el.contains(s.anchorNode))return el.textContent.length;const r=document.createRange();r.selectNodeContents(el);r.setEnd(s.anchorNode,s.anchorOffset);return r.toString().length}
function setCaret(el,pos){el.focus();const t=el.textContent.length,p=pos==='end'?t:Math.min(pos,t),s=getSelection(),r=document.createRange();if(el.firstChild)r.setStart(el.firstChild,p);else r.setStart(el,0);r.collapse(true);s.removeAllRanges();s.addRange(r)}
function edge(el,up){const s=getSelection();if(!s.rangeCount)return true;const r=s.getRangeAt(0).cloneRange();r.collapse(true);const c=r.getClientRects()[0];if(!c||!c.height)return true;const b=el.getBoundingClientRect(),lh=parseFloat(getComputedStyle(el).lineHeight)||27;return up?c.top-b.top<lh*.6:b.bottom-c.bottom<lh*.6}
const visible=()=>[...document.querySelectorAll('#list .txt')].filter(e=>!e.closest('li').parentElement.closest('li.collapsed'));
function go(id,pos){focusReq={id,pos};render();save()}

function render(){
  let p=path(S.zoom);if(!p){S.zoom='root';p=[S.root]}
  const z=p[p.length-1];
  const M=view==='map';$('#map').hidden=!M;$('#list').hidden=$('#pad').hidden=M;
  const cr=$('#crumbs');cr.textContent='';
  p.forEach((n,i)=>{
    if(i){const s=document.createElement('span');s.className='sep';s.textContent='›';cr.append(s)}
    const last=i===p.length-1,el=document.createElement(last?'span':'button');
    el.className='crumb'+(last?' cur':'');el.textContent=i===0?'Home':(n.text||'Untitled');
    if(!last)el.onclick=()=>zoomTo(n.id);cr.append(el);
  });
  cr.scrollLeft=cr.scrollWidth;
  const t=$('#title');t.hidden=M||z.id==='root';t.textContent=z.text;
  const nt=$('#note');nt.hidden=M||z.id==='root';nt.textContent=z.note||'';
  if(M){focusReq=null;drawMap(z);return}
  if(!z.children.length)z.children.push(mk());
  const ul=$('#list');ul.textContent='';z.children.forEach(c=>ul.append(row(c)));
  if(focusReq){const el=document.querySelector('#list .txt[data-id="'+focusReq.id+'"]');if(el){setCaret(el,focusReq.pos);el.scrollIntoView({block:'nearest'})}focusReq=null}
}

    e.preventDefault();const c=ctx(n.id),j=c.i+(k==='ArrowUp'?-1:1);
    if(j<0||j>=c.par.children.length)return;
    c.par.children.splice(c.i,1);c.par.children.splice(j,0,n);go(n.id,caret(el));
  }else if(mod&&(k==='ArrowUp'||k==='ArrowDown')){
    e.preventDefault();if(n.children.length){n.collapsed=k==='ArrowUp';go(n.id,caret(el))}
  }else if((k==='ArrowUp'||k==='ArrowDown')&&!e.shiftKey&&edge(el,k==='ArrowUp')){
    const v=visible(),t=v[v.indexOf(el)+(k==='ArrowUp'?-1:1)];
    if(t){e.preventDefault();setCaret(t,Math.min(caret(el),t.textContent.length))}
  }
}

function paste(e,n,el){
  e.preventDefault();
  const t=(e.clipboardData.getData('text/plain')||'').replace(/\r/g,'');
  const L=t.split('\n').filter(x=>x.trim()).map(x=>({d:x.match(/^[\t ]*/)[0].replace(/\t/g,'  ').length>>1,t:x.replace(/^\s*(?:[-*\u2022]\s+)?/,'')}));
  if(L.length<2){document.execCommand('insertText',false,t.replace(/\n/g,' '));return}
  document.execCommand('insertText',false,L[0].t);n.text=el.textContent;
  const c=ctx(n.id);let idx=c.i+1,last=n;const stack=[{n,d:L[0].d}];
  for(const l of L.slice(1)){
    while(stack.length&&stack[stack.length-1].d>=l.d)stack.pop();
    const nn=mk(l.t);
    if(stack.length)stack[stack.length-1].n.children.push(nn);else c.par.children.splice(idx++,0,nn);
    stack.push({n:nn,d:l.d});last=nn;
  }
  go(last.id,'end');
}
